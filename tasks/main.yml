---
- name: Install dependencies
  apt:
    pkg:
      - apt-transport-https
      - lsb-release
      - ca-certificates
      - gpg
    update_cache: true

- name: Distribution specific install
  include_tasks: "install_{{ ansible_distribution }}.yml"

- name: Install common php extensions
  apt:
    pkg: "{{ item }}"
    update_cache: true
  loop: "{{ php_common }}"

- name: Install php versions
  apt:
    pkg: "{{ lookup('vars', item.version) | union(php_versions[item.version].default_modules | union(item.get('modules_extra', [])) | map('regex_replace', '^(.*)$', 'php' + php_versions[item.version].version + '-\\1') | list ) }}"
    state: latest
    update_cache: true
  loop: "{{ php }}"

- name: Remove unused php versions
  apt:
    pkg: "{{ lookup('vars', item) }}"
    state: absent
  when: php_remove_unused_versions
  loop: "{{ php_versions.keys() | difference(php | map(attribute='version') | list) }}"

- name: Remove unused php modules
  apt:
    pkg: "{{ php_versions[item.version].all_modules | difference(php_versions[item.version].default_modules) | difference(item.get('modules_extra', [])) | map('regex_replace', '^(.*)$', 'php' + php_versions[item.version].version + '-\\1') | list  }}"
    state: absent
  when: php_remove_unused_modules
  loop: "{{ php }}"

- name: Configure fpm/php.ini
  ini_file:
    path: "{{ php_versions[item.0.version].conf_dir }}/fpm/php.ini"
    section: "{{ item.1.section }}"
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
  register: version_to_restart
  notify: restart php-fpm
  when: php_manage_fpm | bool
  loop: "{{ query('subelements', php, 'fpm_ini', {'skip_missing': True}) }}"

# Même snippet sur chaque SAPI HTTP. Le CLI ne parse pas les requêtes multipart.
- name: Install fpm session security snippet
  template:
    src: 99-session-security.ini.j2
    dest: "{{ php_versions[item.version].conf_dir }}/fpm/conf.d/99-session-security.ini"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ php }}"
  loop_control:
    label: "{{ item.version }}/fpm"
  when: php_manage_fpm | bool
  register: php_fpm_session_security_result
  notify: restart php-fpm session security

- name: Install apache2 session security snippet
  template:
    src: 99-session-security.ini.j2
    dest: "{{ php_versions[item.version].conf_dir }}/apache2/conf.d/99-session-security.ini"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ php }}"
  loop_control:
    label: "{{ item.version }}/apache2"
  when: php_manage_apache2 | bool
  notify: reload apache2

# php-fpm.conf n'existe pas sans le paquet fpm. Sans ce garde, l'hôte mod_php casse ici.
- name: Fix fpm/php-fpm.conf too large inclusions
  lineinfile:
    path: "{{ php_versions[item.version].conf_dir }}fpm/php-fpm.conf"
    regexp: '^include\=/etc/php/(.*)/fpm/pool.d/'
    line: "include=/etc/php/\\1/fpm/pool.d/{{ fpm_conf_pool_pattern_to_include | default ('www') }}.conf"
    backrefs: yes
    state: present
  when: php_manage_fpm | bool
  loop: "{{ php }}"
  ignore_errors: '{{ ansible_check_mode }}'

- name: Configure fpm/php-fpm.conf
  ini_file:
    path: "{{ php_versions[item.0.version].conf_dir }}/fpm/pool.d/www.conf"
    section: "{{ item.1.section }}"
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
  register: version_to_restart
  notify: restart php-fpm
  when: php_manage_fpm | bool
  loop: "{{ query('subelements', php, 'www_pool_conf', {'skip_missing': True}) }}"

# mods-available est partagé entre SAPI. FPM redémarre, Apache recharge.
- name: Configure extra conf.d config files
  ini_file:
    path: "{{ php_versions[item.0.version].conf_dir }}mods-available/{{ item.1.file }}"
    section: "{{ item.1.section | default ('') }}"
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
  register: version_to_restart
  notify:
    - restart php-fpm
    - reload apache2
  loop: "{{ query('subelements', php, 'mod_conf', {'skip_missing': True}) }}"

- name: Configure cli/php.ini
  ini_file:
    path: "{{ php_versions[item.0.version].conf_dir }}/cli/php.ini"
    section: "{{ item.1.section }}"
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
  loop: "{{ query('subelements', php, 'cli_ini', {'skip_missing': True}) }}"

# Même forme que fpm_ini. Register séparé : version_to_restart redémarre php-fpm.
- name: Configure apache2/php.ini
  ini_file:
    path: "{{ php_versions[item.0.version].conf_dir }}/apache2/php.ini"
    section: "{{ item.1.section }}"
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
    mode: "0644"
  notify: reload apache2
  when: php_manage_apache2 | bool
  loop: "{{ query('subelements', php, 'apache2_ini', {'skip_missing': True}) }}"

# Tag php_upload_progress : ne passe que ce bloc.
# PHP_INI_PERDIR : php.ini ne suffit pas.
# FPM : php_admin_flag du pool www. Les pools vhost sont dans cytadel.website.
# Apache : php_admin_flag dans conf-available. .user.ini n'est pas lu par mod_php.
- name: Disable session upload progress
  tags:
    - php_upload_progress
  block:
    - name: Disable session upload progress in cli/php.ini
      ini_file:
        path: "{{ php_versions[item.version].conf_dir }}/cli/php.ini"
        section: Session
        option: session.upload_progress.enabled
        value: "Off"
      loop: "{{ php }}"
      loop_control:
        label: "{{ item.version }}/cli"
      register: php_upload_progress_cli

    - name: Disable session upload progress in fpm/php.ini
      ini_file:
        path: "{{ php_versions[item.version].conf_dir }}/fpm/php.ini"
        section: Session
        option: session.upload_progress.enabled
        value: "Off"
      loop: "{{ php }}"
      loop_control:
        label: "{{ item.version }}/fpm"
      when: php_manage_fpm | bool
      register: php_upload_progress_fpm

    - name: Disable session upload progress in apache2/php.ini
      ini_file:
        path: "{{ php_versions[item.version].conf_dir }}/apache2/php.ini"
        section: Session
        option: session.upload_progress.enabled
        value: "Off"
      loop: "{{ php }}"
      loop_control:
        label: "{{ item.version }}/apache2"
      when: php_manage_apache2 | bool
      notify: reload apache2
      register: php_upload_progress_apache

    - name: Disable session upload progress in the default www pool
      ini_file:
        path: "{{ php_versions[item.version].conf_dir }}/fpm/pool.d/www.conf"
        section: www
        option: "php_admin_flag[session.upload_progress.enabled]"
        value: "off"
      loop: "{{ php }}"
      loop_control:
        label: "{{ item.version }}"
      when: php_manage_fpm | bool
      register: php_upload_progress_www

    - name: Lock session upload progress for mod_php
      copy:
        src: php-upload-progress.conf
        dest: /etc/apache2/conf-available/php-upload-progress.conf
        owner: root
        group: root
        mode: "0644"
      when: php_manage_apache2 | bool
      notify: reload apache2

    - name: Enable php-upload-progress Apache conf
      command:
        argv:
          - a2enconf
          - php-upload-progress
      args:
        creates: /etc/apache2/conf-enabled/php-upload-progress.conf
      when: php_manage_apache2 | bool
      notify: reload apache2

    - name: List php-fpm init scripts
      find:
        paths: /etc/init.d
        patterns: "php*-fpm*"
        file_type: file
      register: php_fpm_init_scripts
      when: php_manage_fpm | bool

    - name: Reload running php-fpm services
      command:
        argv:
          - "{{ item.path }}"
          - reload
      loop: "{{ php_fpm_init_scripts.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - php_manage_fpm | bool
        - (php_upload_progress_cli.changed | default(false)) or (php_upload_progress_fpm.changed | default(false)) or (php_upload_progress_www.changed | default(false))

# php-cgi est absent quand php_manage_cgi est false (binaire manquant = alternatives en erreur).
- name: Set default PHP version
  alternatives:
    name: php
    path: "/usr/bin/php{{ php_default_version }}"

- name: Set default PHP CGI version
  alternatives:
    name: "{{ item.name }}"
    path: "{{ item.path }}"
  loop:
    - { "name": "php-cgi", "path": "/usr/bin/php-cgi{{ php_default_version }}" }
    - { "name": "php-cgi-bin", "path": "/usr/lib/cgi-bin/php{{ php_default_version }}" }
  when: php_manage_cgi | bool
