---
- name: Install dependencies
  apt:
    pkg:
      - apt-transport-https
      - lsb-release
      - ca-certificates
      - gpg
    update_cache: true

- name: Distribution specific install
  include_tasks: "install_{{ ansible_distribution }}.yml"

- name: Install common php extensions
  apt:
    pkg: "{{ item }}"
    update_cache: true
  loop: "{{ php_common }}"

- name: Install php versions
  apt:
    pkg: "{{ lookup('vars', item.version) | union(php_versions[item.version].default_modules | union(item.get('modules_extra', [])) | map('regex_replace', '^(.*)$', 'php' + php_versions[item.version].version + '-\\1') | list ) }}"
    state: latest
    update_cache: true
  loop: "{{ php }}"

- name: Remove unused php versions
  apt:
    pkg: "{{ lookup('vars', item) }}"
    state: absent
  when: php_remove_unused_versions
  loop: "{{ php_versions.keys() | difference(php | map(attribute='version') | list) }}"

- name: Remove unused php modules
  apt:
    pkg: "{{ php_versions[item.version].all_modules | difference(php_versions[item.version].default_modules) | difference(item.get('modules_extra', [])) | map('regex_replace', '^(.*)$', 'php' + php_versions[item.version].version + '-\\1') | list  }}"
    state: absent
  when: php_remove_unused_modules
  loop: "{{ php }}"

- name: Configure fpm/php.ini
  ini_file:
    path: "{{ php_versions[item.0.version].conf_dir }}/fpm/php.ini"
    section: "{{ item.1.section }}"
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
  register: version_to_restart
  notify: restart php-fpm
  loop: "{{ query('subelements', php, 'fpm_ini', {'skip_missing': True}) }}"

- name: Fix fpm/php-fpm.conf too large inclusions
  lineinfile:
    path: "{{ php_versions[item.version].conf_dir }}fpm/php-fpm.conf"
    regexp: '^include\=/etc/php/(.*)/fpm/pool.d/'
    line: "include=/etc/php/\\1/fpm/pool.d/{{ fpm_conf_pool_pattern_to_include | default ('www') }}.conf"
    backrefs: yes
    state: present
  loop: "{{ php }}"
  ignore_errors: '{{ ansible_check_mode }}'

- name: Configure fpm/php-fpm.conf
  ini_file:
    path: "{{ php_versions[item.0.version].conf_dir }}/fpm/pool.d/www.conf"
    section: "{{ item.1.section }}"
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
  register: version_to_restart
  notify: restart php-fpm
  loop: "{{ query('subelements', php, 'www_pool_conf', {'skip_missing': True}) }}"

- name: Configure extra conf.d config files
  ini_file:
    path: "{{ php_versions[item.0.version].conf_dir }}mods-available/{{ item.1.file }}"
    section: "{{ item.1.section | default ('') }}"
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
  register: version_to_restart
  notify: restart php-fpm
  loop: "{{ query('subelements', php, 'mod_conf', {'skip_missing': True}) }}"


- name: Configure cli/php.ini
  ini_file:
    path: "{{ php_versions[item.0.version].conf_dir }}/cli/php.ini"
    section: "{{ item.1.section }}"
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
  loop: "{{ query('subelements', php, 'cli_ini', {'skip_missing': True}) }}"

# Tag php_upload_progress : ne passe que ce bloc.
# Le php.ini ne suffit pas (PHP_INI_PERDIR, un .user.ini peut réactiver).
# Le flag du pool www verrouille phpX.Y-fpm. Les pools vhost sont dans cytadel.website.
- name: Disable session upload progress
  tags:
    - php_upload_progress
  block:
    - name: Disable session upload progress in every installed php.ini
      ini_file:
        path: "{{ php_versions[item.1.version].conf_dir }}/{{ item.0 }}/php.ini"
        section: Session
        option: session.upload_progress.enabled
        value: "Off"
      loop: "{{ ['fpm', 'cli'] | product(php) | list }}"
      loop_control:
        label: "{{ item.1.version }}/{{ item.0 }}"
      register: php_upload_progress_ini

    - name: Disable session upload progress in the default www pool
      ini_file:
        path: "{{ php_versions[item.version].conf_dir }}/fpm/pool.d/www.conf"
        section: www
        option: "php_admin_flag[session.upload_progress.enabled]"
        value: "off"
      loop: "{{ php }}"
      loop_control:
        label: "{{ item.version }}"
      register: php_upload_progress_www

    - name: List php-fpm init scripts
      find:
        paths: /etc/init.d
        patterns: "php*-fpm*"
        file_type: file
      register: php_fpm_init_scripts

    - name: Reload running php-fpm services
      command:
        argv:
          - "{{ item.path }}"
          - reload
      loop: "{{ php_fpm_init_scripts.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: php_upload_progress_ini.changed or php_upload_progress_www.changed

- name: Set default PHP version
  alternatives:
    name: "{{ item.name }}"
    path: "{{ item.path }}"
  loop:
    - { "name": "php", "path": "/usr/bin/php{{ php_default_version }}" }
    - { "name": "php-cgi", "path": "/usr/bin/php-cgi{{ php_default_version }}" }
    - { "name": "php-cgi-bin", "path": "/usr/lib/cgi-bin/php{{ php_default_version }}" }
#    - { "name": "php-config", "path": "/usr/bin/php-config7.3" }
#    - { "name": "phpdbg", "path": "/usr/bin/phpdbg7.3" }
#    - { "name": "phpize", "path": "/usr/bin/phpize7.3" }
