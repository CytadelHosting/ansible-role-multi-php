---
- name: Check if /etc/apt/sources.list.d/sury-php.list exists
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/sury-php.list
  register: php_sury_repo_file

- name: Fail if Sury PHP repository file is missing
  ansible.builtin.fail:
    msg: >-
      Missing /etc/apt/sources.list.d/sury-php.list.
      Run role `cytadel.baseline.repo_sury` before `CytadelHosting_multi_php`.
  when: not php_sury_repo_file.stat.exists

- name: Read /etc/apt/sources.list.d/sury-php.list
  ansible.builtin.slurp:
    src: /etc/apt/sources.list.d/sury-php.list
  register: php_sury_repo_file_raw

- name: Fail if sury-php.list does not declare packages.sury.org/php
  ansible.builtin.assert:
    that:
      - (php_sury_repo_file_raw.content | b64decode) is regex('(?m)^\\s*deb(\\s+\\[[^\\]]+\\])?\\s+https://packages\\.sury\\.org/php/\\s+.*\\s+main\\s*$')
    fail_msg: >-
      /etc/apt/sources.list.d/sury-php.list exists but does not contain a valid
      packages.sury.org/php repository entry. Run `cytadel.baseline.repo_sury` before
      `CytadelHosting_multi_php`.
