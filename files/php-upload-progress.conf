# Verrou session.upload_progress pour mod_php.
# La directive est PHP_INI_PERDIR : php.ini ne suffit pas, un php_flag
# dans un .htaccess peut la réactiver. php_admin_flag est PHP_INI_SYSTEM.
# mod_php5.c = PHP 5.6 Sury (php5_module). Les autres IfModule couvrent PHP 7/8.
<IfModule mod_php5.c>
    php_admin_flag session.upload_progress.enabled Off
</IfModule>
<IfModule mod_php7.c>
    php_admin_flag session.upload_progress.enabled Off
</IfModule>
<IfModule mod_php.c>
    php_admin_flag session.upload_progress.enabled Off
</IfModule>
